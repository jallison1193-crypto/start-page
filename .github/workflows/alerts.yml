name: Update service alerts
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-alerts.mjs
      - name: Save the alerts
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add data/alerts.json
          git diff --staged --quiet || (git commit -m "Update service alerts" && git pull --rebase && git push)
