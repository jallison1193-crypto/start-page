name: Update service alerts
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: write
# Both data bots push to main. Sharing one queue means they take turns instead of racing each other.
concurrency:
  group: data-bots
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-alerts.mjs
      - name: Save the alerts
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add data/alerts.json
          git diff --staged --quiet && exit 0
          git commit -m "Update service alerts"
          # Someone else may have pushed in the meantime: catch up and try again
          for try in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((try * 5))
          done
          exit 1
